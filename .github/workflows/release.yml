name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) and this
# builds the desktop app for Windows, macOS and Linux plus the single-file
# HTML, then publishes them all as a GitHub Release.
on:
  push:
    tags: ["v*"]
    # Dry run: pushing this branch builds every app but publishes nothing.
    branches: [release-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build the desktop app
        run: npm run dist
        env:
          # Not code-signed: no certificates needed.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in release/*.exe release/*.dmg release/*.AppImage release/*.deb; do cp "$f" out/; done
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            version=$(node -p "require('./package.json').version")
            cp "dist-single/Air Riders Tracker.html" "out/Air-Riders-Stat-Tracker-${version}.html"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes
        run: |
          {
            echo "## Download"
            echo ""
            echo "| Your computer | File |"
            echo "|---|---|"
            echo "| Windows (installer) | \`...-setup.exe\` |"
            echo "| Windows (no install) | \`...-portable.exe\` |"
            echo "| Mac (Apple Silicon) | \`...-mac-arm64.dmg\` |"
            echo "| Mac (Intel) | \`...-mac-x64.dmg\` |"
            echo "| Linux | \`.AppImage\` or \`.deb\` |"
            echo "| Any browser, no install | \`.html\`: double-click to open |"
            echo ""
            echo "The app isn't code-signed, so Windows may show \"Windows protected your PC\" (click **More info → Run anyway**) and macOS may say it can't verify the developer (right-click the app → **Open**)."
            echo ""
            awk "/^## \[${GITHUB_REF_NAME#v}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Air Riders Stat Tracker ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
